# Lint, tipos, testes, build do Next e build da imagem (sem publicar) em todo
# PR e push. O deploy (GHCR + repo de infra) entra no workflow de deploy.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: read # @whitelabel-store/* no GitHub Packages

env:
  NODE_VERSION: "24"
  NPM_VERSION: "11.6.2"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: "@whitelabel-store"

      - name: npm ${{ env.NPM_VERSION }}
        run: npm install -g "npm@${NPM_VERSION}"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
